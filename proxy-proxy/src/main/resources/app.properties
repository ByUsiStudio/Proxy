#注册中心
adminAddress=http://proxy.cdifit.cn
#注册名字
name=节点名称
#当前服务的域名
#比如 hp.xxx.com作为代理服务的后台，解析时用的*.xxx.com
host=proxy.api.2.byusi.cn
#暴露给用户的域名 *.xxx.com  *为用户的用户
userHost=zai穿透.store
#穿透传输端口
port=9091
#level 用户级别限定 0不限定
level=0
#业务线程池
web.businessPool=100
#不用epoll
epoll=false
#是否注册到注册中心让用户查看
notReg=false
# 【安全修复】注册中心共享密钥，必须与 proxy-server 的 proxy.regSecret 完全一致。
# 留空则无法从 /proxy/reg 获取 REG_TOKEN，节点的 @CheckApi 接口会 fail-closed 拒绝访问。
regSecret=
# 【安全修复】是否仅允许本机访问时跳过 @CheckApi 校验（默认关闭）。
# 与 notReg 解耦：notReg 只是“是否展示在集群列表”的开关，绝不再影响接口鉴权。
localOnly=false
#默认登陆错误100次就禁止建立TCP连接
login-error=100
#开启图片鉴黄检查，可以单独为用户配置配置是否开启检查
photoCheck=true
#鉴黄分数
score=0.8

#=======================================
# SSL证书自定义配置
#=======================================
# 是否启用自定义SSL证书
ssl.enabled=false
# 密钥库路径（支持JKS、P12格式）
ssl.keyStore=
# 密钥库密码
ssl.keyStorePassword=
# 密钥管理器密码（默认与密钥库密码相同）
ssl.keyManagerPassword=
# 密钥库类型（JKS、P12等），默认JKS
ssl.keyStoreType=JKS
# 信任库路径（可选，用于双向SSL）
ssl.trustStore=
# 信任库密码
ssl.trustStorePassword=
# 信任库类型，默认JKS
ssl.trustStoreType=JKS
# SSL协议（TLS、TLSv1.2、TLSv1.3等），默认TLS
ssl.protocol=TLS
# 是否要求客户端认证（双向SSL），默认false
ssl.clientAuth=false