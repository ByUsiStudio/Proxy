<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>运行日志 · Proxy 控制台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232f6bff' d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="common/css/app.css">
  <script src="/api.js"></script>
  <script src="common/js/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header" id="appHeader"></header>
    <div class="app-body">
      <nav class="side-nav" id="sideNav" aria-label="主导航"></nav>
      <button type="button" class="scrim" id="scrim" aria-label="关闭菜单" tabindex="-1"></button>

      <main class="content" id="content">
        <div class="page-head">
          <div>
            <h1 class="page-head__title">运行日志</h1>
            <p class="page-head__desc">来自本机隧道的实时事件；支持关键词、级别、域名过滤与导出。</p>
          </div>
          <div class="toolbar">
            <a class="btn btn--ghost" href="stats.html">
              <span data-icon="chart"></span><span class="hide-sm">数据统计</span>
            </a>
          </div>
        </div>

        <section class="card">
          <div class="card__head">
            <h2 class="card__title"><span data-icon="filter"></span>过滤与操作</h2>
            <div class="toolbar">
              <span class="chip chip--dot chip--warn" id="channelChip" role="status">实时通道连接中</span>
            </div>
          </div>
          <div class="card__body">
            <div class="toolbar">
              <div class="seg" id="levelSeg" role="group" aria-label="日志级别过滤">
                <button type="button" class="seg__item is-active" data-level="all" aria-pressed="true">全部</button>
                <button type="button" class="seg__item" data-level="debug" aria-pressed="false">debug</button>
                <button type="button" class="seg__item" data-level="info" aria-pressed="false">info</button>
                <button type="button" class="seg__item" data-level="warn" aria-pressed="false">warn</button>
                <button type="button" class="seg__item" data-level="error" aria-pressed="false">error</button>
              </div>
              <select class="select" id="domainFilter" aria-label="按域名过滤" style="width: auto;">
                <option value="all">全部域名</option>
              </select>
              <input class="input" id="keyword" type="search" placeholder="关键词：域名或消息内容"
                     aria-label="关键词过滤" autocomplete="off" style="width: 14rem;">
              <button type="button" class="btn btn--ghost" id="pauseBtn" aria-pressed="false" title="暂停日志渲染，暂停期间的新日志会被丢弃">
                <span data-icon="pause" id="pauseIcon"></span><span id="pauseLabel">暂停</span>
              </button>
              <span class="badge badge--warn hidden" id="bufferBadge" role="status">已丢弃 0 行</span>
            </div>

            <div class="toolbar mt-4">
              <button type="button" class="btn btn--ghost btn--sm" id="exportTxt">
                <span data-icon="download"></span><span>导出 TXT</span>
              </button>
              <button type="button" class="btn btn--ghost btn--sm" id="exportJson">
                <span data-icon="download"></span><span>导出 JSON</span>
              </button>
              <button type="button" class="btn btn--ghost btn--sm" id="copyBtn">
                <span data-icon="copy"></span><span>复制</span>
              </button>
              <button type="button" class="btn btn--ghost btn--sm" id="clearBtn">
                <span data-icon="trash"></span><span>清空</span>
              </button>
              <div class="field-row" style="width: min(100%, 18rem);">
                <input class="input" id="heartbeat" type="text" value="ping" autocomplete="off"
                       placeholder="心跳内容，默认 ping" aria-label="手动探测内容">
                <button type="button" class="btn btn--subtle btn--sm" id="heartbeatBtn" title="向服务端发送 ping，服务端会回显 pong">
                  <span data-icon="zap"></span><span>发送心跳</span>
                </button>
              </div>
              <span class="text-xs faint nums" id="lineCount" role="status">显示 0 / 共 0 行</span>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="card__head">
            <h2 class="card__title"><span data-icon="terminal"></span>实时日志</h2>
            <span class="card__hint">最多保留最近 800 行，超出后自动淘汰最早记录</span>
          </div>
          <div class="card__body">
            <div class="log-view" id="logView" aria-live="polite"></div>
          </div>
          <div class="card__foot" id="logFoot">正在连接实时通道…</div>
        </section>
      </main>
    </div>
  </div>

  <script src="common/js/pages/log.js"></script>
</body>
</html>
