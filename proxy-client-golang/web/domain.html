<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>域名管理 · Proxy 控制台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232f6bff' d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="common/css/app.css">
  <script src="/api.js"></script>
  <script src="common/js/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header" id="appHeader"></header>
    <div class="app-body">
      <nav class="side-nav" id="sideNav" aria-label="主导航"></nav>
      <button type="button" class="scrim" id="scrim" aria-label="关闭菜单" tabindex="-1"></button>

      <main class="content" id="content">
        <div class="page-head">
          <div>
            <h1 class="page-head__title">域名管理</h1>
            <p class="page-head__desc">管理隧道可用的二级域名：二级域名只能包含字母和数字，自定义域名可选填，用于绑定自己的域名。</p>
          </div>
          <div class="toolbar">
            <button type="button" class="btn btn--primary" id="addBtn">
              <span data-icon="plus"></span><span>添加域名</span>
            </button>
            <button type="button" class="btn btn--ghost" id="refreshBtn">
              <span data-icon="refresh"></span><span class="hide-sm">刷新</span>
            </button>
          </div>
        </div>

        <div class="alert alert--info">
          <span data-icon="info"></span>
          <div>如何配置自定义域名：在域名服务商处添加 CNAME 记录，指向系统分配给你的二级域名。</div>
        </div>

        <section class="card">
          <div class="card__head">
            <h2 class="card__title"><span data-icon="globe"></span>域名列表</h2>
            <div class="toolbar">
              <input class="input" id="search" type="search" placeholder="搜索域名" aria-label="搜索域名" style="width: 12rem;">
            </div>
          </div>
          <div class="card__body card__body--flush">
            <div class="table-wrap">
              <table class="table table--stack">
                <thead>
                  <tr>
                    <th class="is-sortable" data-sort="domain" data-sort-type="string">二级域名<span class="sort-ind">↕</span></th>
                    <th class="is-sortable" data-sort="customDomain" data-sort-type="string">自定义域名<span class="sort-ind">↕</span></th>
                    <th style="text-align: right;">操作</th>
                  </tr>
                </thead>
                <tbody id="tabData"></tbody>
              </table>
            </div>
          </div>
          <div class="card__foot" id="listFoot">正在加载域名列表…</div>
        </section>
      </main>
    </div>
  </div>

  <!-- 添加域名 -->
  <div class="modal" id="addModal" role="dialog" aria-modal="true" aria-labelledby="addModalTitle">
    <div class="modal__panel">
      <div class="modal__head">
        <h3 class="modal__title" id="addModalTitle">添加域名</h3>
        <button type="button" class="btn btn--ghost btn--icon" id="addClose" aria-label="关闭">
          <span data-icon="close"></span>
        </button>
      </div>
      <div class="modal__body">
        <form id="domainForm" novalidate>
          <div class="field">
            <label class="field__label" for="domain">二级域名<span class="field__hint">只能包含字母和数字，例如 myapp</span></label>
            <input class="input" id="domain" name="domain" type="text" placeholder="例如 myapp" autocomplete="off" autocapitalize="off" spellcheck="false" data-autofocus="true">
          </div>
          <div class="field">
            <label class="field__label" for="customDomain">自定义域名<span class="field__hint">可选，例如 cdn.example.com</span></label>
            <input class="input" id="customDomain" name="customDomain" type="text" placeholder="留空则只使用二级域名" autocomplete="off" autocapitalize="off" spellcheck="false">
            <p class="faint text-xs mt-2">填写后需在域名服务商处把该域名 CNAME 指向分配到的二级域名，解析生效后方可访问。</p>
          </div>
        </form>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--ghost" id="addCancel">取消</button>
        <button type="button" class="btn btn--primary" id="addSubmit">确定添加</button>
      </div>
    </div>
  </div>

  <script src="common/js/pages/domain.js"></script>
</body>
</html>
