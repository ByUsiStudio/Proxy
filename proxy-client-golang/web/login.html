<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta name="format-detection" content="telephone=no">
  <title>登录 · Proxy 内网穿透</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232f6bff' d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="common/css/app.css">
  <script src="/api.js"></script>
  <script src="common/js/app.js"></script>
</head>
<body>
  <div class="auth">
    <aside class="auth__aside">
      <div>
        <div class="brand" style="font-size: 1.35rem;">
          <span class="brand__mark" id="asideMark"></span>
          <span>Proxy 内网穿透</span>
        </div>
        <p class="auth__slogan mt-4">把内网服务<br>安全地带到公网</p>
        <p class="text-sm mt-2" style="opacity: .82;">
          TCP / UDP / HTTP / HTTPS 全协议支持，二级域名与固定端口任意组合，无需公网 IP。
        </p>
      </div>
      <div class="auth__features" id="featureList"></div>
    </aside>

    <div class="auth__main">
      <div class="auth__card">
        <div class="row row--between mb-4">
          <div class="brand show-sm">
            <span class="brand__mark" id="mainMark"></span>
            <span>Proxy</span>
          </div>
          <div class="header__spacer"></div>
          <div id="themeSlot"></div>
        </div>

        <div class="card">
          <div class="card__body">
            <div class="auth__tabs" role="tablist" aria-label="账号操作">
              <button type="button" class="auth__tab is-active" id="tabLogin" role="tab" aria-selected="true">登录</button>
              <button type="button" class="auth__tab" id="tabRegister" role="tab" aria-selected="false">注册 / 重置密码</button>
            </div>

            <form id="loginForm" novalidate>
              <div class="field">
                <label class="field__label" for="login_username">邮箱</label>
                <input class="input" id="login_username" name="username" type="email"
                       autocomplete="username" placeholder="you@example.com" required>
              </div>
              <div class="field">
                <label class="field__label" for="login_password">密码</label>
                <input class="input" id="login_password" name="password" type="password"
                       autocomplete="current-password" placeholder="请输入密码" required>
              </div>
              <button class="btn btn--primary btn--block" id="login_btn" type="submit">登录</button>
              <p class="faint text-xs mt-2" id="loginHint">
                账号密码仅用于云端鉴权；密码只保留在当前标签页，关闭浏览器后需要重新输入。
              </p>
            </form>

            <form id="registerForm" class="hidden" novalidate>
              <div class="field">
                <label class="field__label" for="reg_username">邮箱</label>
                <input class="input" id="reg_username" name="username" type="email"
                       autocomplete="username" placeholder="you@example.com" required>
              </div>
              <div class="field">
                <label class="field__label" for="reg_password">密码</label>
                <input class="input" id="reg_password" name="password" type="password"
                       autocomplete="new-password" placeholder="至少 6 位" required>
              </div>
              <div class="field">
                <label class="field__label" for="reg_code">
                  邮箱验证码
                  <span class="field__hint">有效期 5 分钟</span>
                </label>
                <div class="field-row">
                  <input class="input" id="reg_code" name="code" inputmode="numeric"
                         autocomplete="one-time-code" placeholder="6 位数字" required>
                  <button type="button" class="btn btn--subtle" id="send_email">发送验证码</button>
                </div>
              </div>
              <button class="btn btn--primary btn--block" id="reg_btn" type="submit">注册 / 重置密码</button>
            </form>
          </div>
        </div>

        <div class="card mt-4">
          <div class="card__head">
            <h3 class="card__title" id="donateTitle">最新支持者</h3>
          </div>
          <div class="card__body">
            <div class="donor-list" id="pay"></div>
            <details class="mt-4">
              <summary class="text-sm muted" style="cursor: pointer;">查看打赏二维码</summary>
              <div class="qr mt-4">
                <img src="img/pay.jpg" alt="打赏二维码" width="240" height="240" loading="lazy">
              </div>
            </details>
          </div>
        </div>

        <p class="faint text-xs mt-4" style="text-align: center;">
          永久免费 · 无需充值 · 控制台仅允许本机或持有令牌的设备访问
        </p>
      </div>
    </div>
  </div>

  <script src="common/js/pages/login.js"></script>
</body>
</html>
