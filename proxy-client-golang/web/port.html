<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>端口管理 · Proxy 控制台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232f6bff' d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="common/css/app.css">
  <script src="/api.js"></script>
  <script src="common/js/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header" id="appHeader"></header>
    <div class="app-body">
      <nav class="side-nav" id="sideNav" aria-label="主导航"></nav>
      <button type="button" class="scrim" id="scrim" aria-label="关闭菜单" tabindex="-1"></button>

      <main class="content" id="content">
        <div class="page-head">
          <div>
            <h1 class="page-head__title">端口管理</h1>
            <p class="page-head__desc">维护可绑定到隧道的外网端口：添加后即可在创建穿透时选择固定端口，不再每次随机分配。</p>
          </div>
          <div class="toolbar">
            <button type="button" class="btn btn--primary" id="addBtn">
              <span data-icon="plus"></span><span>添加端口</span>
            </button>
            <button type="button" class="btn btn--ghost" id="refreshBtn">
              <span data-icon="refresh"></span><span class="hide-sm">刷新</span>
            </button>
          </div>
        </div>

        <section class="card">
          <div class="card__head">
            <h2 class="card__title"><span data-icon="server"></span>端口列表</h2>
            <div class="toolbar">
              <input class="input" id="search" type="search" placeholder="搜索端口号" aria-label="搜索端口号" style="width: 12rem;">
            </div>
          </div>
          <div class="card__body card__body--flush">
            <div class="table-wrap">
              <table class="table table--stack">
                <thead>
                  <tr>
                    <th class="is-sortable table__num" data-sort="port" data-sort-type="number">端口号<span class="sort-ind">↕</span></th>
                    <th style="text-align: right;">操作</th>
                  </tr>
                </thead>
                <tbody id="tabData"></tbody>
              </table>
            </div>
          </div>
          <div class="card__foot" id="listFoot">正在加载端口列表…</div>
        </section>
      </main>
    </div>
  </div>

  <!-- 添加端口 -->
  <div class="modal" id="addModal" role="dialog" aria-modal="true" aria-labelledby="addModalTitle">
    <div class="modal__panel">
      <div class="modal__head">
        <h3 class="modal__title" id="addModalTitle">添加端口</h3>
        <button type="button" class="btn btn--ghost btn--icon" id="addClose" aria-label="关闭">
          <span data-icon="close"></span>
        </button>
      </div>
      <div class="modal__body">
        <form id="portForm" novalidate>
          <div class="field">
            <label class="field__label" for="port">外网端口<span class="field__hint">取值范围 1024-65535</span></label>
            <input class="input" id="port" name="port" type="text" inputmode="numeric" placeholder="例如 8080" autocomplete="off" data-autofocus="true">
          </div>
        </form>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--ghost" id="addCancel">取消</button>
        <button type="button" class="btn btn--primary" id="addSubmit">确定添加</button>
      </div>
    </div>
  </div>

  <script src="common/js/pages/port.js"></script>
</body>
</html>
