<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>穿透服务 · Proxy 控制台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232f6bff' d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="common/css/app.css">
  <script src="/api.js"></script>
  <script src="common/js/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header" id="appHeader"></header>
    <div class="app-body">
      <nav class="side-nav" id="sideNav" aria-label="主导航"></nav>
      <button type="button" class="scrim" id="scrim" aria-label="关闭菜单" tabindex="-1"></button>

      <main class="content" id="content">
        <div class="page-head">
          <div>
            <h1 class="page-head__title">穿透服务</h1>
            <p class="page-head__desc">管理本机全部隧道：实时状态、流量与连接数，支持批量停止与配置导出。</p>
          </div>
          <div class="toolbar">
            <button type="button" class="btn btn--primary" id="addBtn">
              <span data-icon="plus"></span><span>添加穿透</span>
            </button>
            <button type="button" class="btn btn--ghost" id="checkCore">
              <span data-icon="cpu"></span><span class="hide-sm">检查内核</span>
            </button>
            <button type="button" class="btn btn--ghost" id="refreshBtn">
              <span data-icon="refresh"></span><span class="hide-sm">刷新</span>
            </button>
          </div>
        </div>

        <section class="grid grid--tight" aria-label="运行概览">
          <div class="kpi">
            <span class="kpi__icon" data-icon="rocket"></span>
            <div class="kpi__body">
              <div class="kpi__value" id="kpiTunnels">—</div>
              <div class="kpi__label">隧道总数</div>
            </div>
          </div>
          <div class="kpi">
            <span class="kpi__icon kpi__icon--down" data-icon="activity"></span>
            <div class="kpi__body">
              <div class="kpi__value" id="kpiOnline">—</div>
              <div class="kpi__label">在线隧道</div>
            </div>
          </div>
          <div class="kpi">
            <span class="kpi__icon kpi__icon--warn" data-icon="link"></span>
            <div class="kpi__body">
              <div class="kpi__value" id="kpiConns">—</div>
              <div class="kpi__label">活跃连接</div>
            </div>
          </div>
          <div class="kpi">
            <span class="kpi__icon kpi__icon--up" data-icon="zap"></span>
            <div class="kpi__body">
              <div class="kpi__value" id="kpiTraffic">—</div>
              <div class="kpi__label">累计转发流量</div>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="card__head">
            <h2 class="card__title"><span data-icon="list"></span>隧道列表</h2>
            <div class="toolbar">
              <label class="switch" title="按固定间隔自动刷新列表">
                <input type="checkbox" id="autoRefresh">
                <span class="switch__track"></span>
                <span>自动刷新</span>
              </label>
              <select class="select" id="interval" aria-label="自动刷新间隔" style="width: auto;">
                <option value="2000">2 秒</option>
                <option value="5000" selected>5 秒</option>
                <option value="10000">10 秒</option>
                <option value="30000">30 秒</option>
              </select>
              <input class="input" id="search" type="search" placeholder="搜索域名 / 目标 / 服务器" style="width: 12rem;">
              <button type="button" class="btn btn--danger btn--sm" id="batchStop" disabled>
                <span data-icon="stop"></span><span>批量停止</span>
              </button>
              <button type="button" class="btn btn--ghost btn--sm" id="exportBtn">
                <span data-icon="download"></span><span>导出</span>
              </button>
            </div>
          </div>
          <div class="card__body card__body--flush">
            <div class="table-wrap">
              <table class="table table--stack">
                <thead>
                  <tr>
                    <th style="width: 2.5rem;">
                      <input type="checkbox" id="selectAll" aria-label="全选隧道">
                    </th>
                    <th class="is-sortable" data-sort="Domain" data-sort-type="string">域名<span class="sort-ind">↕</span></th>
                    <th class="is-sortable" data-sort="Type" data-sort-type="string">类型<span class="sort-ind">↕</span></th>
                    <th class="is-sortable" data-sort="Target" data-sort-type="string">内网服务<span class="sort-ind">↕</span></th>
                    <th class="is-sortable" data-sort="Server" data-sort-type="string">穿透服务器<span class="sort-ind">↕</span></th>
                    <th class="is-sortable" data-sort="Status" data-sort-type="boolean">状态<span class="sort-ind">↕</span></th>
                    <th class="is-sortable table__num" data-sort="InBytes" data-sort-type="number">入站<span class="sort-ind">↕</span></th>
                    <th class="is-sortable table__num" data-sort="OutBytes" data-sort-type="number">出站<span class="sort-ind">↕</span></th>
                    <th class="is-sortable table__num" data-sort="ConnCount" data-sort-type="number">连接<span class="sort-ind">↕</span></th>
                    <th class="is-sortable table__num" data-sort="Uptime" data-sort-type="number">时长<span class="sort-ind">↕</span></th>
                    <th style="text-align: right;">操作</th>
                  </tr>
                </thead>
                <tbody id="tabData"></tbody>
              </table>
            </div>
          </div>
          <div class="card__foot" id="listFoot">正在加载隧道列表…</div>
        </section>

        <section class="card">
          <div class="card__head">
            <h2 class="card__title"><span data-icon="terminal"></span>实时日志</h2>
            <a class="btn btn--ghost btn--sm" href="log.html">
              <span data-icon="external"></span><span>日志中心</span>
            </a>
          </div>
          <div class="card__body">
            <div class="log-view" id="logPreview" aria-live="polite"></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- 添加穿透 -->
  <div class="modal" id="addModal" role="dialog" aria-modal="true" aria-labelledby="addModalTitle">
    <div class="modal__panel">
      <div class="modal__head">
        <h3 class="modal__title" id="addModalTitle">添加穿透服务</h3>
        <button type="button" class="btn btn--ghost btn--icon" id="addClose" aria-label="关闭">
          <span data-icon="close"></span>
        </button>
      </div>
      <div class="modal__body">
        <form id="handle-form" novalidate>
          <div class="field">
            <label class="field__label" for="ip">内网 IP<span class="field__hint">被穿透服务所在的内网地址</span></label>
            <input class="input" id="ip" name="ip" type="text" placeholder="127.0.0.1" autocomplete="off">
          </div>
          <div class="field">
            <label class="field__label" for="port">内网端口</label>
            <input class="input" id="port" name="port" type="text" inputmode="numeric" placeholder="8080" autocomplete="off">
          </div>
          <div class="field">
            <span class="field__label">穿透类型</span>
            <div class="radios" id="typeRadios"></div>
          </div>
          <div class="field" id="serverField">
            <span class="field__label">穿透服务器</span>
            <div class="radios" id="serverRadios"></div>
          </div>
          <div class="field hidden" id="customServerField">
            <label class="field__label" for="customServer">自定义穿透服务器</label>
            <input class="input" id="customServer" type="text" placeholder="ip:端口，例如 1.2.3.4:9090" autocomplete="off">
          </div>
          <div class="field" id="domainField">
            <span class="field__label">穿透域名</span>
            <div class="radios" id="domainRadios"></div>
          </div>
          <div class="field">
            <span class="field__label">外网端口</span>
            <div class="radios" id="portRadios"></div>
          </div>
        </form>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--ghost" id="addCancel">取消</button>
        <button type="button" class="btn btn--primary" id="addSubmit">确定添加</button>
      </div>
    </div>
  </div>

  <!-- 通用信息弹窗（内核检查等） -->
  <div class="modal" id="infoModal" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
    <div class="modal__panel">
      <div class="modal__head">
        <h3 class="modal__title" id="infoTitle">提示</h3>
        <button type="button" class="btn btn--ghost btn--icon" id="infoClose" aria-label="关闭">
          <span data-icon="close"></span>
        </button>
      </div>
      <div class="modal__body" id="infoBody"></div>
      <div class="modal__foot">
        <button type="button" class="btn btn--ghost" id="infoOk">知道了</button>
      </div>
    </div>
  </div>

  <script src="common/js/pages/center.js"></script>
</body>
</html>
