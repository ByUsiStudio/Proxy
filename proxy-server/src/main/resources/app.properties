# 【安全修复】管理后台入口密码（默认口令已移除）。
# 必须由运维人员设置成强密码；留空时 AuthFilter 会拒绝所有 /admin 请求（fail-closed），
# 不再出现“未配置密码=完全放行”的失败开放问题。
password=
# 发送邮件的邮箱地址
notice.mail=177828525@qq.com
mail.username=177828525@qq.com
# 邮箱的smtp的密码
mail.password=***
# 邮箱的smtp服务器地址
mail.host=smtp.qq.com
# 邮箱的smtp端口
mail.port=465
# 不必在意，这个配置
proxy.size=3
# 【安全修复】代理节点注册密钥（/proxy/reg 的共享密钥）。
# 必须与各代理节点 app.properties 中的 regSecret 保持一致；留空时 /proxy/reg 直接拒绝，
# 防止匿名调用者拿到 REG_TOKEN（该 token 是所有 @CheckApi 接口的通行证）。
# 建议使用 32 位以上随机字符串，例如 openssl rand -hex 32。
proxy.regSecret=
# 【安全修复】允许跨域访问的来源白名单（逗号分隔，需带 http(s):// 前缀）。
# 留空时默认只允许本机配置的 host 与请求自身 Host，绝不再返回 Access-Control-Allow-Origin: *。
cors.allowedOrigins=
# 【安全修复 J1/J12/J13】是否信任前置反向代理的转发头（X-Forwarded-For / X-Forwarded-Proto / X-Forwarded-Host）。
# 默认 false：来源IP 一律取真实 TCP 对端地址，CSRF 同源校验按本次连接的实际协议与 Host 比较，
# Cookie 的 Secure 也只在服务端确知 HTTPS 时才追加。
# 仅当云端确实部署在 Nginx/Cloudflare 等可信代理之后时才改为 true：
# 此时 X-Forwarded-For 取「从右往左第一个不可信跳」，X-Forwarded-Proto 才会被用于判断 HTTPS。
trusted.proxy=false
